<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>FinPlus</title>

  <!-- Ponašanje kao aplikacija kad se doda na početni zaslon (iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FinPlus">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
  <!-- Ako je uključeno zaključavanje, sakrij sadržaj prije nego se išta prikaže -->
  <script>try { if (localStorage.getItem('fp:lock')) document.documentElement.classList.add('locked'); } catch (e) {}</script>
</head>
<body>
  <div id="demo-banner">Demo način — podaci se spremaju samo u ovom pregledniku</div>

  <!-- Prijava / registracija -->
  <main id="auth" hidden></main>

  <!-- Glavni dio aplikacije -->
  <div id="app" hidden>
    <header class="navbar" id="navbar"><span class="nav-title" id="nav-title"></span></header>
    <div class="title-row">
      <h1 class="large-title" id="title"></h1>
      <!-- Skeniranje QR koda s fiskalnog računa (samo na kartici Trošak) -->
      <button type="button" class="title-action" id="scan-btn" aria-label="Skeniraj račun" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8c.2-.3.6-.5 1-.5h3.4c.4 0 .8.2 1 .5L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.3" r="3.4"/></svg>
        <span>Račun</span>
      </button>
      <input type="file" id="scan-file" accept="image/*" capture="environment" hidden>
    </div>
    <div id="sync-banner" role="status" hidden></div>
    <main id="view"></main>
    <nav class="tabbar">
      <button data-view="trosak">
        <svg viewBox="0 0 24 24"><circle class="s f" cx="12" cy="12" r="9.5"/><path class="s k" d="M7.5 12h9"/></svg>
        <span>Trošak</span>
      </button>
      <button data-view="prihod">
        <svg viewBox="0 0 24 24"><circle class="s f" cx="12" cy="12" r="9.5"/><path class="s k" d="M12 7.5v9M7.5 12h9"/></svg>
        <span>Prihod</span>
      </button>
      <button data-view="pregled">
        <svg viewBox="0 0 24 24"><rect class="s f" x="3.5" y="11" width="4" height="9.5" rx="1.2"/><rect class="s f" x="10" y="3.5" width="4" height="17" rx="1.2"/><rect class="s f" x="16.5" y="7.5" width="4" height="13" rx="1.2"/></svg>
        <span>Pregled</span>
      </button>
      <button data-view="postavke">
        <svg viewBox="0 0 24 24"><path class="s" d="M3.5 6.5h9M18.5 6.5h2M3.5 12h3M12.5 12h8M3.5 17.5h11M20.5 17.5h0"/><circle class="s f" cx="15.5" cy="6.5" r="2.5"/><circle class="s f" cx="9.5" cy="12" r="2.5"/><circle class="s f" cx="17.5" cy="17.5" r="2.5"/></svg>
        <span>Postavke</span>
      </button>
    </nav>
  </div>

  <!-- Donji prozor za uređivanje troška -->
  <div id="sheet-backdrop" hidden></div>
  <section id="sheet" hidden></section>

  <!-- Zaključani zaslon (Face ID) -->
  <div id="lock" role="dialog" aria-label="FinPlus je zaključan">
    <img src="icons/icon-192.png" alt="">
    <h2>FinPlus je zaključan</h2>
    <p id="lock-msg">Otključaj Face ID-jem ili šifrom uređaja.</p>
    <button type="button" class="btn-filled" id="lock-open">Otključaj</button>
    <button type="button" class="btn-plain" id="lock-out">Odjavi se</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
