<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinPlus</title>

  <!-- Ponašanje kao aplikacija kad se doda na početni zaslon (iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FinPlus">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="demo-banner">Demo način — podaci se spremaju samo u ovom pregledniku</div>

  <!-- Prijava / registracija -->
  <main id="auth" hidden></main>

  <!-- Glavni dio aplikacije -->
  <div id="app" hidden>
    <header class="navbar" id="navbar"><span class="nav-title" id="nav-title"></span></header>
    <h1 class="large-title" id="title"></h1>
    <main id="view"></main>
    <nav class="tabbar">
      <button data-view="trosak">
        <svg viewBox="0 0 24 24"><circle class="s f" cx="12" cy="12" r="9.5"/><path class="s k" d="M7.5 12h9"/></svg>
        <span>Trošak</span>
      </button>
      <button data-view="prihod">
        <svg viewBox="0 0 24 24"><circle class="s f" cx="12" cy="12" r="9.5"/><path class="s k" d="M12 7.5v9M7.5 12h9"/></svg>
        <span>Prihod</span>
      </button>
      <button data-view="pregled">
        <svg viewBox="0 0 24 24"><rect class="s f" x="3.5" y="11" width="4" height="9.5" rx="1.2"/><rect class="s f" x="10" y="3.5" width="4" height="17" rx="1.2"/><rect class="s f" x="16.5" y="7.5" width="4" height="13" rx="1.2"/></svg>
        <span>Pregled</span>
      </button>
      <button data-view="racun">
        <svg viewBox="0 0 24 24"><circle class="s f" cx="12" cy="7.5" r="4"/><path class="s f" d="M4 20.5c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5z"/></svg>
        <span>Račun</span>
      </button>
    </nav>
  </div>

  <!-- Donji prozor za uređivanje troška -->
  <div id="sheet-backdrop" hidden></div>
  <section id="sheet" hidden></section>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
